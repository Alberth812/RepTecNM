services:
  database:
    image: postgres:15-alpine
    container_name: reptecnm_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: reptecnm_db
      POSTGRES_USER: reptecnm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ReptecnmSecure2026!}
    volumes:
      - reptecnm_postgres_data:/var/lib/postgresql/data
    networks:
      - reptecnm_network

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: reptecnm_backend
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - reptecnm_media:/app/media_files
    depends_on:
      - database
    networks:
      - reptecnm_network

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: reptecnm_frontend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      - backend
    networks:
      - reptecnm_network

  nginx:
    image: nginx:alpine
    container_name: reptecnm_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - reptecnm_media:/app/media:ro
    ports:
      - "8003:80"
    depends_on:
      - backend
      - frontend
    networks:
      - reptecnm_network

volumes:
  reptecnm_postgres_data:
  reptecnm_media:

networks:
  reptecnm_network:
    driver: bridge
