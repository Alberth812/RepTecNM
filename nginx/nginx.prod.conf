events {}

http {

    client_max_body_size 15M;

    upstream nextjs {
        server next:3000;
    }

    upstream garage_s3 {
        server garage:3900;
    }

    # --------------------------------------------------
    # Next.js
    # http://10.168.0.109.nip.io:3000 (o http://localhost:3000)
    # --------------------------------------------------

    server {
        listen 80;
        server_name localhost 10.168.0.109.nip.io;

        location / {
            proxy_pass http://nextjs;

            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }
    }

    # --------------------------------------------------
    # Garage S3 (con soporte para subdominios estilo path o virtual-hosted)
    # http://s3.10.168.0.109.nip.io:3000
    # --------------------------------------------------

    server {
        listen 80;
        # Usamos expresiones regulares o comodines para capturar tanto 
        # s3.10.168.0.109.nip.io como posibles subdominios de buckets (bucket.s3.10.168.0.109.nip.io)
        server_name s3.10.168.0.109.nip.io *.s3.10.168.0.109.nip.io;

        location / {
            proxy_pass http://garage_s3;

            proxy_http_version 1.1;

            # MUY IMPORTANTE: conservar exactamente el Host 
            # para la firma SigV4 de S3.
            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering off;
            proxy_buffering off;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }
    }
}