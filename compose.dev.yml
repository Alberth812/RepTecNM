services:
  nginx:
    image: nginx:1.31-alpine
    container_name: dev-nginx
    depends_on:
      - next
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      app:
      backend:
        aliases:
          - s3.localhost

  next:
    image: node:24-alpine
    container_name: dev-next
    working_dir: /app
    command: sh -c "corepack enable && pnpm next dev --webpack --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://app:app_dev_password@postgres:5432/app

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

      S3_INTERNAL_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: http://s3.localhost:3000
      S3_REGION: garage
      S3_FORCE_PATH_STYLE: "true"

      S3_AFFILIATES_BUCKET: ${GARAGE_AFFILIATES_BUCKET}
      S3_AFFILIATES_ACCESS_KEY_ID: ${GARAGE_AFFILIATES_ACCESS_KEY}
      S3_AFFILIATES_SECRET_ACCESS_KEY: ${GARAGE_AFFILIATES_SECRET_KEY}

      S3_CMS_BUCKET: ${GARAGE_CMS_BUCKET}
      S3_CMS_ACCESS_KEY_ID: ${GARAGE_CMS_ACCESS_KEY}
      S3_CMS_SECRET_ACCESS_KEY: ${GARAGE_CMS_SECRET_KEY}

      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_SERVER_URL: ${PAYLOAD_SERVER_URL}

    volumes:
      - ./:/app
      - next_node_modules:/app/node_modules

    expose:
      - "3000"

    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
      garage-cors-init:
        condition: service_completed_successfully

    networks:
      - app
      - backend

  postgres:
    image: postgres:18.6-alpine
    container_name: dev-postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    networks:
      - backend

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: dev-garage
    restart: unless-stopped
    command:
      - /garage
      - server
      - --single-node
    volumes:
      - ./garage/garage.dev.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    expose:
      - "3900"
      - "3901"
      - "3902"
    networks:
      - backend

  garage-init:
    build:
      context: ./garage
      dockerfile: Dockerfile.init
    container_name: dev-garage-init
    depends_on:
      garage:
        condition: service_started
    # Comparte el network namespace de "garage" para poder hablar
    # por RPC (3901) igual que si hicieras "docker exec garage ...".
    network_mode: "service:garage"
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_AFFILIATES_BUCKET: ${GARAGE_AFFILIATES_BUCKET}
      GARAGE_AFFILIATES_ACCESS_KEY: ${GARAGE_AFFILIATES_ACCESS_KEY}
      GARAGE_AFFILIATES_SECRET_KEY: ${GARAGE_AFFILIATES_SECRET_KEY}
      GARAGE_CMS_BUCKET: ${GARAGE_CMS_BUCKET}
      GARAGE_CMS_ACCESS_KEY: ${GARAGE_CMS_ACCESS_KEY}
      GARAGE_CMS_SECRET_KEY: ${GARAGE_CMS_SECRET_KEY}
    volumes:
      - ./garage/garage.dev.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta:ro
      - ./garage/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  garage-cors-init:
    image: amazon/aws-cli:2.36.33
    container_name: dev-garage-cors-init
    depends_on:
      garage:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
    environment:
      AWS_DEFAULT_REGION: garage
      GARAGE_AFFILIATES_BUCKET: ${GARAGE_AFFILIATES_BUCKET}
      GARAGE_AFFILIATES_ACCESS_KEY: ${GARAGE_AFFILIATES_ACCESS_KEY}
      GARAGE_AFFILIATES_SECRET_KEY: ${GARAGE_AFFILIATES_SECRET_KEY}
      GARAGE_CMS_BUCKET: ${GARAGE_CMS_BUCKET}
      GARAGE_CMS_ACCESS_KEY: ${GARAGE_CMS_ACCESS_KEY}
      GARAGE_CMS_SECRET_KEY: ${GARAGE_CMS_SECRET_KEY}
    volumes:
      - ./garage/cors-development.json:/cors.json:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        configure_cors() {
          bucket_name="$$1"
          access_key="$$2"
          secret_key="$$3"

          export AWS_ACCESS_KEY_ID="$${access_key}"
          export AWS_SECRET_ACCESS_KEY="$${secret_key}"

          echo "Esperando bucket $${bucket_name}..."
          until aws s3api head-bucket \
            --bucket "$${bucket_name}" \
            --endpoint-url "http://garage:3900" \
            --region garage
          do
            sleep 3
          done

          echo "Configurando CORS en $${bucket_name}..."
          aws s3api put-bucket-cors \
            --bucket "$${bucket_name}" \
            --endpoint-url "http://garage:3900" \
            --region garage \
            --cors-configuration file:///cors.json

          echo "CORS listo en $${bucket_name}."
        }

        configure_cors "$${GARAGE_AFFILIATES_BUCKET}" "$${GARAGE_AFFILIATES_ACCESS_KEY}" "$${GARAGE_AFFILIATES_SECRET_KEY}"
        configure_cors "$${GARAGE_CMS_BUCKET}" "$${GARAGE_CMS_ACCESS_KEY}" "$${GARAGE_CMS_SECRET_KEY}"
    networks:
      - backend
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: dev-mailpit
    ports:
      - "8025:8025"
    expose:
      - "1025"
    networks:
      - backend

  portainer:
    image: portainer/portainer-ce:latest
    container_name: dev-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - app

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  next_node_modules:
  portainer_data:

networks:
  app:
  backend:
