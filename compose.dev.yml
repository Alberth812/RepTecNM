services:
  nginx:
    image: nginx:1.31-alpine
    container_name: dev-nginx
    depends_on:
      - next
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      app:
      backend:
        aliases:
          - s3.localhost

  next:
    image: node:24-alpine
    container_name: dev-next
    working_dir: /app
    command: sh -c "corepack enable && pnpm next dev --webpack --hostname 0.0.0.0"
    environment:
      NODE_ENV: development

      DATABASE_URL: postgresql://app:app_dev_password@postgres:5432/app

      S3_INTERNAL_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: http://s3.localhost:3000

      S3_REGION: garage
      S3_BUCKET: ${GARAGE_DEFAULT_BUCKET}
      S3_ACCESS_KEY_ID: ${GARAGE_DEFAULT_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${GARAGE_DEFAULT_SECRET_KEY}

      S3_FORCE_PATH_STYLE: "true"

    volumes:
      - ./:/app
      - next_node_modules:/app/node_modules

    expose:
      - "3000"

    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

    networks:
      - app
      - backend

  postgres:
    image: postgres:18.6-alpine
    container_name: dev-postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    networks:
      - backend

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: dev-garage
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
    volumes:
      - ./garage/garage-dev.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    expose:
      - "3900"
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: dev-mailpit
    ports:
      - "8025:8025"
    expose:
      - "1025"
    networks:
      - backend

  portainer:
    image: portainer/portainer-ce:latest
    container_name: dev-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - app

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  next_node_modules:
  portainer_data:

networks:
  app:
  backend:
