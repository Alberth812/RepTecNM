# docker-compose.dev.yml
version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reptecnm-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_MINIO_URL=http://localhost/media
    networks:
      - app-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reptecnm-backend
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-change-in-prod
      - DATABASE_URL=postgres://user:password@db:5432/asociacion_db
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
    ports:
      - "8001:8000" # Temporal para depuración directa, luego se manejará solo por Nginx
    depends_on:
      - db
      - minio
    networks:
      - app-net
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: reptecnm-db
    environment:
      - POSTGRES_DB=asociacion_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: reptecnm-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000" # API
      - "9003:9001" # Consola web (útil para desarrollo)
    networks:
      - app-net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: reptecnm-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
  minio-data: